# Research-only paper-trading controls.
# This file is intentionally not loaded by the live scoring or broker paths.
# A live adapter must explicitly opt in and pass every staged gate below.

mode: paper
research_only: true
broker:
  enabled: false
  live_orders_enabled: false
  require_manual_approval: true

# Conservative simulation assumptions. Values are fractions of notional unless
# otherwise noted; callers should record the assumptions with every fill.
execution:
  commission_bps: 2.0
  slippage_bps: 5.0
  partial_fill_ratio: 0.80
  reject_if_stale_seconds: 30
  reject_if_missing_quote: true
  simulate_latency_ms: 250

risk_limits:
  max_risk_per_trade_pct: 0.50
  max_daily_loss_pct: 1.50
  max_open_positions: 3
  max_notional_per_position_pct: 20.0
  max_gross_exposure_pct: 60.0
  max_orders_per_day: 20
  stop_trading_after_consecutive_losses: 3

signal_gates:
  min_confidence_score: 70
  max_risk_score: 55
  min_rr_ratio: 1.50
  min_tod_rvol: 0.70
  block_on_market_breakdown: true
  block_on_unknown_event_risk: true
  block_on_stale_data: true

# Promotion is deliberately staged; no stage changes production behavior.
promotion_gates:
  paper:
    min_mature_trades: 100
    min_days: 20
    require_cost_adjusted_positive_expectancy: true
  shadow:
    min_mature_trades: 250
    min_days: 40
    require_two_market_regimes: true
    require_base_oos_non_degradation: true
  live_review:
    min_mature_trades: 500
    min_days: 60
    min_calibrated_predictions: 100
    require_manual_signoff: true
    require_kill_switch_test: true
    require_cost_and_slippage_audit: true

audit:
  log_dir: reports/paper_trading
  persist_orders: true
  persist_fills: true
  persist_positions: true
  persist_assumptions_per_fill: true
